<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue — A Quiet Ocean</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('whale-swim', {
      init: function () {
        this.origin = this.el.object3D.position.clone();
        this.clock = 0;
      },
      tick: function (time, delta) {
        this.clock += delta * 0.00032;
        const p = this.el.object3D.position;
        p.x = this.origin.x + Math.sin(this.clock) * 1.35;
        p.y = this.origin.y + Math.sin(this.clock * 1.6) * 0.24;
        this.el.object3D.rotation.y = Math.sin(this.clock) * 0.12;
        this.el.object3D.rotation.z = Math.sin(this.clock * 1.6) * 0.025;
      }
    });
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #06243a;
      color: #e8f8ff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a-scene { position: absolute; inset: 0; }
    .caption {
      position: fixed;
      z-index: 2;
      top: clamp(22px, 5vh, 52px);
      left: clamp(22px, 6vw, 76px);
      pointer-events: none;
      text-shadow: 0 2px 18px #00131dcc;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #91d9e9;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5.5vw, 62px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: .98;
    }
    .caption p:last-child {
      max-width: 260px;
      margin: 14px 0 0;
      color: #c1dce5;
      font-size: 13px;
      line-height: 1.6;
    }
    .hint {
      position: fixed;
      z-index: 2;
      right: clamp(22px, 5vw, 64px);
      bottom: clamp(22px, 5vh, 48px);
      color: #b8d8e2;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px #00131d;
      pointer-events: none;
    }
    @media (max-width: 520px) {
      .caption p:last-child { max-width: 210px; font-size: 12px; }
      .hint { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="caption" aria-label="Blue, a quiet ocean">
    <p class="eyebrow">A little deeper</p>
    <h1>Blue</h1>
    <p>Drift awhile with the quiet giants of the deep.</p>
  </div>
  <div class="hint" aria-hidden="true">Drag to look around</div>

  <a-scene
    background="color: #06243a"
    fog="type: exponential; color: #0b3b55; density: 0.035"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: true"
    loading-screen="dotsColor: #a7e7f2; backgroundColor: #06243a">

    <a-assets>
      <a-mixin id="mote" geometry="primitive: sphere; radius: 0.018"
        material="color: #c9f7ff; emissive: #56cbe8; emissiveIntensity: 0.35; transparent: true; opacity: 0.55; shader: standard"></a-mixin>
    </a-assets>

    <a-sky color="#082b43"></a-sky>
    <a-entity light="type: ambient; color: #8bbdd0; intensity: 0.62"></a-entity>
    <a-entity light="type: directional; color: #c5f3ff; intensity: 1.15" position="-3 8 2"></a-entity>
    <a-entity light="type: directional; color: #2f86a7; intensity: 0.6" position="4 -2 -5"></a-entity>

    <!-- Soft columns of surface light fade into the blue. -->
    <a-entity position="0 5 -9" rotation="0 0 -10">
      <a-cone height="11" radius-bottom="2.8" radius-top="0.25" open-ended="true"
        material="color: #71d9ed; transparent: true; opacity: 0.055; side: double; depthWrite: false; shader: standard"></a-cone>
    </a-entity>
    <a-entity position="-5 4 -15" rotation="0 0 13" scale="0.72 1 1">
      <a-cone height="10" radius-bottom="2.2" radius-top="0.2" open-ended="true"
        material="color: #4bb8d4; transparent: true; opacity: 0.045; side: double; depthWrite: false; shader: standard"></a-cone>
    </a-entity>
    <a-entity position="6 4 -19" rotation="0 0 -18" scale="0.82 1 1">
      <a-cone height="10" radius-bottom="2.5" radius-top="0.2" open-ended="true"
        material="color: #64c8df; transparent: true; opacity: 0.04; side: double; depthWrite: false; shader: standard"></a-cone>
    </a-entity>

    <!-- A distant, gently rolling ocean surface. -->
    <a-plane position="0 8 -12" rotation="-90 0 0" width="200" height="200"
      material="color: #2b94ad; transparent: true; opacity: 0.14; side: double; roughness: 0.3; metalness: 0.05"></a-plane>
    <a-plane position="0 -13 -15" rotation="-90 0 0" width="200" height="200"
      material="color: #061b2b; roughness: 1"></a-plane>

    <!-- Whale silhouette: head faces right, with a pale underside and broad flukes. -->
    <a-entity id="whale" whale-swim position="0 0 -8">
      <a-entity id="whale-body" animation="property: rotation; from: 0 0 -1; to: 0 0 1; dur: 4200; dir: alternate; loop: true; easing: easeInOutSine">
        <a-sphere color="#267f9e" radius="1" position="-0.15 0 0" scale="2.05 0.88 0.76"
          material="color: #267f9e; roughness: 0.42; metalness: 0.08"></a-sphere>
        <a-sphere color="#318eaa" radius="1" position="1.32 0.02 0" scale="0.95 0.78 0.73"
          material="color: #318eaa; roughness: 0.4; metalness: 0.06"></a-sphere>
        <a-sphere color="#b7dce0" radius="1" position="0.48 -0.43 0" scale="1.27 0.35 0.665"
          material="color: #b7dce0; roughness: 0.72"></a-sphere>
        <!-- Throat grooves -->
        <a-box color="#8fc5d0" width="0.025" height="0.32" depth="0.018" position="1.05 -0.57 0.37" rotation="0 0 -9"></a-box>
        <a-box color="#8fc5d0" width="0.025" height="0.34" depth="0.018" position="0.89 -0.59 0.39" rotation="0 0 -9"></a-box>
        <a-box color="#8fc5d0" width="0.025" height="0.35" depth="0.018" position="0.73 -0.6 0.4" rotation="0 0 -9"></a-box>
        <!-- Eyes on both sides, each with a small glint. -->
        <a-sphere color="#071b2a" radius="0.105" position="1.55 0.24 0.64"></a-sphere>
        <a-sphere color="#d9f8fa" radius="0.029" position="1.58 0.28 0.718"></a-sphere>
        <a-sphere color="#071b2a" radius="0.105" position="1.55 0.24 -0.64"></a-sphere>
        <a-sphere color="#d9f8fa" radius="0.029" position="1.58 0.28 -0.718"></a-sphere>
        <!-- Pectoral fins -->
        <a-entity position="0.25 -0.48 0.47" rotation="0 0 -18"
          animation="property: rotation; from: 0 0 -18; to: 12 0 -24; dur: 2600; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere color="#216f8c" radius="1" scale="0.78 0.14 0.3" rotation="0 0 -5"></a-sphere>
        </a-entity>
        <a-entity position="0.25 -0.48 -0.47" rotation="0 0 -18"
          animation="property: rotation; from: 0 0 -18; to: -12 0 -24; dur: 2600; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere color="#216f8c" radius="1" scale="0.78 0.14 0.3" rotation="0 0 -5"></a-sphere>
        </a-entity>
        <!-- Tail stock and animated horizontal flukes -->
        <a-sphere color="#267f9e" radius="1" position="-2.05 -0.04 0" scale="0.7 0.28 0.35"></a-sphere>
        <a-entity position="-2.5 -0.05 0" animation="property: rotation; from: -16 0 0; to: 16 0 0; dur: 1700; dir: alternate; loop: true; easing: easeInOutSine">
          <a-sphere color="#267f9e" radius="1" position="-0.13 0 0.47" scale="0.45 0.12 0.69" rotation="0 0 -13"></a-sphere>
          <a-sphere color="#267f9e" radius="1" position="-0.13 0 -0.47" scale="0.45 0.12 0.69" rotation="0 0 13"></a-sphere>
        </a-entity>
        <a-sphere color="#216f8c" radius="1" position="-0.08 0.81 0" scale="0.29 0.12 0.18" rotation="0 0 8"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- Rising bubbles at different depths. -->
    <a-entity id="bubbles"></a-entity>
    <a-entity id="plankton"></a-entity>

    <a-entity id="camera-rig" position="0 0.15 0" animation="property: position; from: 0 0.15 0; to: 0 0.28 0; dur: 5200; dir: alternate; loop: true; easing: easeInOutSine">
      <a-camera position="0 0 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false" fov="72">
        <a-cursor raycaster="objects: .interactive" visible="false"></a-cursor>
      </a-camera>
    </a-entity>

    <script>
      const random = (min, max) => min + Math.random() * (max - min);
      const bubbles = document.querySelector('#bubbles');
      for (let i = 0; i < 24; i++) {
        const bubble = document.createElement('a-sphere');
        const x = random(-8, 8), z = random(-23, -4), baseY = random(-7, 4);
        const size = random(0.025, 0.075);
        bubble.setAttribute('radius', size);
        bubble.setAttribute('position', `${x} ${baseY} ${z}`);
        bubble.setAttribute('material', 'color: #8be8f4; transparent: true; opacity: 0.35; roughness: 0.12; metalness: 0.25');
        bubble.setAttribute('animation', `property: position; from: ${x} ${baseY} ${z}; to: ${x + random(-0.45, 0.45)} ${baseY + random(6, 12)} ${z}; dur: ${random(9000, 17000)}; delay: ${random(0, 9000)}; loop: true; easing: linear`);
        bubbles.appendChild(bubble);
      }

      const plankton = document.querySelector('#plankton');
      for (let i = 0; i < 110; i++) {
        const mote = document.createElement('a-entity');
        mote.setAttribute('mixin', 'mote');
        mote.setAttribute('position', `${random(-18, 18)} ${random(-9, 8)} ${random(-30, 2)}`);
        mote.setAttribute('animation', `property: material.opacity; from: ${random(0.12, 0.3)}; to: ${random(0.48, 0.85)}; dur: ${random(1800, 4200)}; delay: ${random(0, 3000)}; loop: true; dir: alternate; easing: easeInOutSine`);
        plankton.appendChild(mote);
      }
    </script>
  </a-scene>
</body>
</html>
